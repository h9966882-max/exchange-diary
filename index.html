<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exchange Diary</title><style>
:root{--ink:#f3ead2;--gold:#d8bb75;--navy:#10192b}*{box-sizing:border-box}body{margin:0;background:#17140f;color:var(--ink);font-family:Georgia,"Hiragino Mincho ProN",serif;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:32px 18px}.top{text-align:center}.top h1{font-size:20px;letter-spacing:.16em}.auth{max-width:460px;margin:24px auto;padding:20px;border:1px solid #ffffff22;border-radius:16px;text-align:center}.auth input{width:100%;padding:12px;border-radius:10px;border:1px solid #ffffff22;background:#fff;color:#222}.auth button,.btn{margin-top:12px;padding:11px 18px;border:0;border-radius:999px;background:#e9d7a7;color:#241b10;font-weight:700;cursor:pointer}.library{display:none;margin-top:28px;padding:28px 22px 18px;border-radius:20px;background:linear-gradient(90deg,#3e2a1f 0 3%,transparent 3% 97%,#3e2a1f 97%),linear-gradient(#8b684b,#654833);box-shadow:0 28px 75px #0009}.shelf{min-height:330px;display:flex;align-items:flex-end;gap:18px;padding:22px 24px 0;background:linear-gradient(90deg,#563b2b,#75553d 50%,#563b2b);border-radius:10px}.spine{width:76px;height:270px;border:0;color:#efe5ca;background:linear-gradient(90deg,#0c1424,#1c2944 18%,#17223a 55%,#0c1424);border-radius:5px;box-shadow:8px 9px 15px #0007;writing-mode:vertical-rl;padding:18px 11px;cursor:pointer}.spine b{color:var(--gold)}.plank{height:24px;margin:0 -8px;background:linear-gradient(#7c5a40,#4b3224);box-shadow:0 12px 22px #0008}.cover{display:none;margin:35px auto;width:280px;height:390px;border-radius:8px 16px 16px 8px;background:linear-gradient(90deg,#09101e,#182642 14%,#101b31);box-shadow:18px 24px 45px #000a;padding:60px 28px;text-align:center;cursor:pointer}.cover h2{font-size:20px;letter-spacing:.12em}.cover .vol{font-size:30px;color:var(--gold);margin:70px 0 20px}.panel{display:none;max-width:720px;margin:30px auto;background:#f1e6ca;color:#292219;padding:32px;border-radius:8px;min-height:420px;box-shadow:15px 20px 45px #0008}.wait{text-align:center;padding:90px 20px}.small{font-size:12px;opacity:.7}.nav{display:none;text-align:center;margin:15px}.error{color:#ffb7b7}.privacy{text-align:center;font-size:12px;opacity:.6;margin-top:18px}
</style></head><body><div class="wrap"><header class="top"><h1>📔 Exchange Diary</h1><div class="small">Hiroisa × Atsushi</div></header>
<section id="auth" class="auth"><p>🔒 この日記は非公開です。</p><input id="email" type="email" placeholder="メールアドレス"><button id="login">ログインリンクを送る</button><p id="msg" class="small"></p></section>
<div id="nav" class="nav"><button class="btn" id="home">← 本棚へ</button></div>
<section id="library" class="library"><div style="text-align:center;letter-spacing:.2em;font-size:12px;margin-bottom:20px">BOOKSHELF</div><div class="shelf"><button class="spine" id="vol1"><b>Vol.001</b><span style="margin-top:18px">OPEN</span></button></div><div class="plank"></div><p class="privacy">本を選んで、棚から取り出す。</p></section>
<section id="cover" class="cover"><h2>Exchange Diary</h2><div class="vol">Vol.001</div><div id="dates">OPEN</div><div class="small" style="margin-top:55px">Hiroisa × Atsushi</div></section>
<section id="panel" class="panel"><div id="state">読み込み中…</div></section><div class="privacy">🔒 日記本文と写真はGitHubには保存されません。</div></div>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";
const sb=createClient("https://wvsogabeckhuhcqelpja.supabase.co","sb_publishable_tT9nE3rcfJQnjD7cSp543w_kcJSGq_s");
const $=id=>document.getElementById(id);let session=null;
async function boot(){const{data}=await sb.auth.getSession();session=data.session;if(session)await enter();sb.auth.onAuthStateChange(async(_,s)=>{session=s;if(s)await enter()})}
$("login").onclick=async()=>{const email=$("email").value.trim();if(!email)return $("msg").textContent="メールアドレスを入力してね。";const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split("#")[0]}});$("msg").textContent=error?error.message:"📮 ログインリンクを送りました。"};
async function enter(){const{data:ok,error}=await sb.rpc("is_exchange_diary_owner");if(error||!ok){$("msg").textContent="このアカウントには日記へのアクセス権がありません。";return}$("auth").style.display="none";$("library").style.display="block"}
$("vol1").onclick=()=>{$("library").style.display="none";$("cover").style.display="block";$("nav").style.display="block"};
$("cover").onclick=async()=>{$("cover").style.display="none";$("panel").style.display="block";await load()};
$("home").onclick=()=>{$("panel").style.display="none";$("cover").style.display="none";$("library").style.display="block";$("nav").style.display="none"};
async function load(){let{data:b,error}=await sb.from("exchange_diary_books").select("*").order("volume",{ascending:false}).limit(1).maybeSingle();if(error)return $("state").innerHTML='<p class="error">'+error.message+"</p>";if(!b){$("state").innerHTML='<div class="wait"><h2>Vol.001</h2><p>まだ最初のページは始まっていません。</p><p class="small">Vol.001の開始準備中 📔</p></div>';return}$("dates").textContent=(b.started_on||"").replaceAll("-","/")+" — "+(b.status==="closed"?(b.closed_on||"").replaceAll("-","/"):"OPEN");if(b.current_writer==="atsushi"){$("state").innerHTML='<div class="wait"><h2>📔 ノートは篤史のところにあります。</h2><p>返ってくるまで、日常をどうぞ。</p></div>';return}$("state").innerHTML='<h2>Day '+b.current_page+'｜Hiroisa</h2><p>あなたの番です ✍️</p><p class="small">本文を書く画面は次の実装で接続します。</p>'}
boot();
</script></body></html>
